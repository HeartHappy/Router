pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
enableFeaturePreview('VERSION_CATALOGS')
dependencyResolutionManagement {
    // Gradle plugin projects that depend on gradleApi() may inject the internal
    // "Gradle Libs" repository during IDE sync. Prefer settings repositories,
    // but do not fail the sync for this Gradle-managed repository.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        mavenCentral()
        google()
    }
}

rootProject.name = "Router"
include ':app'
include ':compiler'
include ':annotations'
include ':core'
include ':mylibrary'
include ':mylibrary2'
include ':common-api'
include ':router-migration-plugin'
